name: Update watched TV episodes

on:
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * 1" # Mondays 08:41 UTC (~1:41am Pacific), after ratings scrape

permissions:
  contents: write
  actions: write

concurrency:
  group: update-watched-episodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-r-env

      # Fetch every episode for each rated TV Series / Mini Series in the IMDb
      # export. Per-series fetch errors are swallowed by the script; a
      # zero-episode overall result or a shrink vs. the committed CSV aborts
      # the run (no-shrink guard, no env var set here).
      - name: Fetch watched TV episodes
        run: Rscript web_scraping/imdb_watched_episodes.R

      # Sanity check: the only file this script is allowed to touch is
      # data/watched_tv_episodes.csv. Abort before commit otherwise.
      - name: Verify only watched episodes CSV changed
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only HEAD \
            | grep -Ev '^data/watched_tv_episodes\.csv$' || true)"
          if [ -n "$unexpected" ]; then
            echo "ERROR: script modified tracked files outside data/watched_tv_episodes.csv:"
            echo "$unexpected"
            exit 1
          fi
          echo "OK: only watched episodes CSV changed (or no change)."

      - name: Commit and push if changed
        id: push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/watched_tv_episodes.csv

          if git diff --cached --quiet; then
            echo "No changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          staged_other="$(git diff --cached --name-only \
            | grep -Ev '^data/watched_tv_episodes\.csv$' || true)"
          if [ -n "$staged_other" ]; then
            echo "ERROR: refusing to commit unexpected staged files:"
            echo "$staged_other"
            exit 1
          fi

          git commit -m "Auto-update watched TV episodes"

          for i in 1 2 3; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push failed; rebasing on remote and retrying ($i/3)..."
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          done
          echo "ERROR: failed to push watched episodes update after 3 attempts."
          exit 1

      # Bot pushes via GITHUB_TOKEN don't trigger downstream workflows (a
      # GitHub anti-recursion guard), so dispatch the build workflow explicitly.
      - name: Trigger site redeploy
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-branch-previews.yml --ref main
