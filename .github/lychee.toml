# Lychee broken-link checker config
# https://lychee.cli.rs/usage/config/

# Network
max_concurrency = 8
max_retries = 2
retry_wait_time = 3
timeout = 20
no_progress = true

# Don't fail on transient connection issues; we'll see them in the report.
# 202 is shinyapps.io answering while a sleeping app spins up (a live app, not
# a broken link); the pinned lychee version has no per-host accept list.
accept = [200, 202, 206, 301, 302, 303, 307, 308, 403, 429, 999]


# Exclude noisy / always-flaky destinations
exclude = [
  # localhost / private addrs
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://0\\.0\\.0\\.0",

  # mailto / tel
  "^mailto:",
  "^tel:",

  # Known to block bots / aggressively rate-limit
  "linkedin\\.com",
  "^https?://(www\\.)?facebook\\.com",
  "^https?://(www\\.)?twitter\\.com",
  "^https?://(www\\.)?x\\.com",
  "^https?://(www\\.)?instagram\\.com",
  "^https?://(www\\.)?reddit\\.com",
  "^https?://(www\\.)?quora\\.com",

  # Sites that frequently return 4xx to non-browser UA but work fine
  "^https?://(www\\.)?imdb\\.com",
  "^https?://(www\\.)?rottentomatoes\\.com",
  "^https?://(www\\.)?boxofficemojo\\.com",
  "^https?://(www\\.)?the-numbers\\.com",
  "^https?://(www\\.)?zillow\\.com",
  "^https?://(www\\.)?redfin\\.com",
  "^https?://(www\\.)?nytimes\\.com",
  "^https?://(www\\.)?wsj\\.com",
  "^https?://(www\\.)?bloomberg\\.com",

  # GitHub Pages preview URLs (will be 404 until deployed)
  "^https?://cavandonohoe\\.github\\.io/pr-",
]

# Skip HTML fragments that the site build copies into _site but that are not
# pages: header/header.html is spliced into every page's <head> via
# `in_header`, so its relative links (e.g. header/favicon-32x32.png) resolve
# against the including page, not against _site/header/.
exclude_path = [
  "_site/header/",
]

# Include verbatim/code blocks too — false positives are mostly excluded above
include_verbatim = false
include_mail = false

# Per-host overrides. Keep these tables last: in TOML every key after a
# [table] header belongs to that table.
# github.com answers bursts of page requests from Actions runners with 503s
# (year_in_review alone links ~80 blob pages). Pace requests to it instead of
# excluding the links.
[hosts."github.com"]
concurrency = 2
request_interval = "500ms"
