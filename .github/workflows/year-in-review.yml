name: Developer year in review
on:
  schedule:
    # Jan 1 at 17:13 UTC; snapshots the year that just ended.
    - cron: '13 17 1 1 *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to snapshot (blank = current year, or previous year on Jan 1)'
        required: false
        type: string
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate annual developer stats
        env:
          GITHUB_USER: cavandonohoe
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_YEAR: ${{ inputs.year }}
        run: python3 scripts/developer_year_in_review.py
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/year-in-review
          git diff --cached --quiet || (git commit -m "Add developer year in review snapshot" && git push)
