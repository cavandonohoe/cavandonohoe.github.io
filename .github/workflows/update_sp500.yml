name: Refresh S&P 500 (VOO) data

on:
  workflow_dispatch:
  schedule:
    - cron: "29 13 * * 6"  # Saturdays 13:29 UTC (~6:29am Pacific) — after market close

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-sp500
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/refresh-data.yml
    with:
      refresh_command: Rscript scripts/sp500_data.R
      data_paths: data/voo_stock_prices.csv
      commit_message: Auto-update VOO stock prices
      timeout_minutes: 20
