name: Update watched TV episodes

on:
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * 1" # Mondays 08:41 UTC (~1:41am Pacific), after ratings scrape

permissions:
  contents: write
  actions: write

concurrency:
  group: update-watched-episodes
  cancel-in-progress: false

jobs:
  # Fetches every episode for each rated TV Series / Mini Series in the IMDb
  # export. Per-series fetch errors are swallowed by the script; a zero-episode
  # result or a shrink vs. the committed CSV aborts the run.
  refresh:
    uses: ./.github/workflows/refresh-data.yml
    with:
      refresh_command: Rscript web_scraping/imdb_watched_episodes.R
      data_paths: data/watched_tv_episodes.csv
      commit_message: Auto-update watched TV episodes
      timeout_minutes: 40
