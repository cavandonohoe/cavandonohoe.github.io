name: Refresh US rental markets data

on:
  workflow_dispatch:
  schedule:
    - cron: "47 14 5 * *"  # 5th of each month, 14:47 UTC — Zillow updates monthly

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-us-rentals
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/refresh-data.yml
    with:
      refresh_command: Rscript scripts/us_rental_markets_data.R
      data_paths: data/us_rental_markets.csv
      commit_message: Auto-update US rental markets data
      timeout_minutes: 30
