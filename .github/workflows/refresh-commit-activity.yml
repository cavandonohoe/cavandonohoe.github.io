name: Refresh commit-activity charts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "images/readme/commit-activity-1.png"
      - "images/readme/commit-activity-cumulative-1.png"
  schedule:
    - cron: "41 13 * * 0"

permissions:
  contents: write
  actions: write

concurrency:
  group: site-generated-writeback
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-r-env

      - name: Re-knit README.Rmd (Activity over time)
        run: Rscript -e 'rmarkdown::render("README.Rmd", quiet = TRUE)'

      - name: Verify only README + chart images changed
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only HEAD \
            | grep -Ev '^(README\.md|images/readme/commit-activity-1\.png|images/readme/commit-activity-cumulative-1\.png)$' \
            || true)"
          if [ -n "$unexpected" ]; then
            echo "ERROR: knit modified files outside the activity-over-time outputs:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and safely push if changed
        id: push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md \
            images/readme/commit-activity-1.png \
            images/readme/commit-activity-cumulative-1.png
          if git diff --cached --quiet; then
            echo "No commit-activity changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-update commit-activity charts"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflicted on generated outputs; regenerating from latest main..."
              git rebase --abort || true
              git reset --hard origin/main
              Rscript -e 'rmarkdown::render("README.Rmd", quiet = TRUE)'
              git add README.md \
                images/readme/commit-activity-1.png \
                images/readme/commit-activity-cumulative-1.png
              if git diff --cached --quiet; then
                echo "Latest main already contains equivalent output."
                echo "pushed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit -m "Auto-update commit-activity charts"
            fi

            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push raced with another writer; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done

          echo "ERROR: failed to push commit-activity update after 3 attempts."
          exit 1

      - name: Trigger site redeploy
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-branch-previews.yml --ref main
