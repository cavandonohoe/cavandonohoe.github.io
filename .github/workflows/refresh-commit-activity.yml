name: Refresh commit-activity charts

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Don't re-run on the bot's own output. Bot pushes via GITHUB_TOKEN
    # already don't retrigger workflows (GitHub anti-recursion guard); this
    # is a second guard so a manual edit to only these files is a no-op too.
    paths-ignore:
      - "README.md"
      - "images/readme/commit-activity-1.png"
      - "images/readme/commit-activity-cumulative-1.png"
  schedule:
    - cron: "41 13 * * 0"  # Sundays 13:41 UTC — safety net

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-commit-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the charts and summary are derived from `git log`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-r-env

      - name: Re-knit README.Rmd (Activity over time)
        run: Rscript -e 'rmarkdown::render("README.Rmd", quiet = TRUE)'

      - name: Verify only README + chart images changed
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only HEAD \
            | grep -Ev '^(README\.md|images/readme/commit-activity-1\.png|images/readme/commit-activity-cumulative-1\.png)$' \
            || true)"
          if [ -n "$unexpected" ]; then
            echo "ERROR: knit modified files outside the activity-over-time outputs:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and push if changed
        id: push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md \
            images/readme/commit-activity-1.png \
            images/readme/commit-activity-cumulative-1.png
          if git diff --cached --quiet; then
            echo "No commit-activity changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-update commit-activity charts"
          # Pull-rebase to avoid losing races with other refresh workflows.
          for i in 1 2 3; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push failed; rebasing on remote and retrying ($i/3)..."
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          done
          echo "ERROR: failed to push commit-activity update after 3 attempts."
          exit 1

      # Bot pushes via GITHUB_TOKEN don't trigger downstream workflows (a
      # GitHub anti-recursion guard), so the site won't redeploy after this
      # commit unless we explicitly dispatch the build workflow.
      - name: Trigger site redeploy
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-branch-previews.yml --ref main
