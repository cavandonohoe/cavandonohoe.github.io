name: Refresh Top 250 movies with Rotten Tomatoes

on:
  workflow_dispatch:
  schedule:
    - cron: "53 13 12 * *"  # 12th of each month, 13:53 UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-top250-rt
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/refresh-data.yml
    with:
      refresh_command: Rscript scripts/refresh_top250_with_rt.R
      data_paths: data/top250_movies_with_rt.csv
      commit_message: Auto-update Top 250 movies with Rotten Tomatoes
      timeout_minutes: 90
