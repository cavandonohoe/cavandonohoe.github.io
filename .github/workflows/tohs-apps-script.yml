name: TOHS Apps Script

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/tohs-apps-script.yml'
      - 'scripts/tohs/**'
      - 'tools/tohs-apps-script/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Apps Script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bundle_changed: ${{ steps.bundle.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install locked tooling without lifecycle scripts
        working-directory: tools/tohs-apps-script
        run: npm ci --ignore-scripts --no-fund
      - name: Validate source inventory and test reconciliation and deployment guards
        working-directory: tools/tohs-apps-script
        run: |
          npm run validate
          npm test

      - name: Compare the Apps Script bundles before and after the push
        id: bundle
        if: github.event_name == 'push'
        working-directory: tools/tohs-apps-script
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { bundle, fingerprint } = require('./manage.cjs');
          const before = process.env.BEFORE_SHA;
          if (!/^[a-f0-9]{40}$/.test(before)) throw new Error('Missing previous main SHA');
          const changed = fingerprint(bundle(before).files) !== fingerprint(bundle().files);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          console.log(changed ? 'Apps Script bundle changed.' : 'Apps Script bundle is identical.');
          NODE

  deploy:
    name: Deploy existing Apps Script
    needs: validate
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.TOHS_APPS_SCRIPT_ENABLED == 'true' && needs.validate.outputs.bundle_changed == 'true'
    environment: tohs-apps-script-production
    concurrency:
      group: tohs-apps-script-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Verify current main came from a merged owner or approved PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/tohs-apps-script/review-gate.cjs
      - name: Install locked tooling without lifecycle scripts
        working-directory: tools/tohs-apps-script
        run: npm ci --ignore-scripts --no-fund
      - name: Recheck source and tests on merged commit
        working-directory: tools/tohs-apps-script
        run: |
          npm run validate
          npm test
      - name: Compare live source, push, and verify readback
        working-directory: tools/tohs-apps-script
        env:
          TOHS_APPS_SCRIPT_ENABLED: ${{ vars.TOHS_APPS_SCRIPT_ENABLED }}
          TOHS_SCRIPT_ID: ${{ secrets.TOHS_SCRIPT_ID }}
          TOHS_CLASPRC_JSON: ${{ secrets.TOHS_CLASPRC_JSON }}
          TOHS_BOOTSTRAP_JSON: ${{ secrets.TOHS_BOOTSTRAP_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: npm run deploy
