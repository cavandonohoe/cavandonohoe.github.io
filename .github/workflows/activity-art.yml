name: Generate activity art
on:
  schedule:
    - cron: '7 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write # needed for the "gh workflow run" redeploy dispatch below

# Per-workflow group: never cancels another workflow's pending run.
# Cross-workflow push races are handled by push_generated_changes.sh.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate SVG from commit activity
        run: python3 scripts/build_activity_art.py
      - name: Commit and safely push art
        id: push
        run: >-
          scripts/push_generated_changes.sh
          'Refresh activity art'
          'python3 scripts/build_activity_art.py'
          assets/generated/activity.svg
      # Pushes made with GITHUB_TOKEN do not trigger the push-based deploy.
      - name: Trigger site redeploy
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-branch-previews.yml --ref main -f deploy_root=true
