[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smut-index"
version = "0.1.0"
description = "Coverage-aware sexual-content research across television and prose"
requires-python = ">=3.12"
dependencies = ["pandas==2.2.3", "pydantic==2.12.3", "plotly==6.3.1", "beautifulsoup4==4.14.2", "requests==2.32.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3", "nbformat==5.10.4"]
export = ["kaleido==1.1.0"]

[project.scripts]
smut-index = "smut_index.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
