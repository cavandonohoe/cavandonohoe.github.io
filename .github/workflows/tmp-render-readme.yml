name: Scratch render README charts
on:
  push:
    branches: [scratch/render-readme-xaxis]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-r-env
      - run: Rscript -e 'rmarkdown::render("README.Rmd", quiet = TRUE)'
      - uses: actions/upload-artifact@v4
        with:
          name: readme-charts
          path: images/readme/commit-activity*.png
