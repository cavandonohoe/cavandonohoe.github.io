<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Procedural Maze Art</title><style>
:root{color-scheme:dark}body{margin:0;background:#060b11;color:#dcebf4;font:16px system-ui,sans-serif}
main{max-width:1150px;margin:auto;padding:24px}h1{font-size:1.6rem;margin:0 0 8px}
p{color:#a8bdc9}canvas{display:block;width:100%;height:auto;background:#060b11;border:1px solid #233342;border-radius:12px}
.controls{display:flex;flex-wrap:wrap;align-items:end;gap:16px;margin:18px 0}label{display:grid;gap:6px}
input,button{font:inherit}input{width:110px;padding:8px;background:#111e29;color:white;border:1px solid #415361;border-radius:6px}
button{padding:10px 14px;background:#15374a;color:white;border:1px solid #477b96;border-radius:7px;cursor:pointer}
</style></head><body><main><h1>Procedural Maze Art</h1><p>A connected maze generated with randomized depth-first search and rendered as luminous geometric outlines. Inspired by a floor-plan installation; not a reconstruction of its optimization model.</p>
<div class="controls"><label>Columns<input id="cols" type="number" min="4" max="65" value="22"></label><label>Rows<input id="rows" type="number" min="4" max="45" value="14"></label><label>Seed<input id="seed" type="number" value="7"></label><label>Speed<input id="speed" type="range" min="1" max="100" value="55"></label><button id="play">Pause</button><button id="replay">Replay</button><button id="generate">Generate</button><button id="random">Random seed</button><button id="save">Save PNG</button></div>
<canvas id="maze" width="1400" height="900" aria-label="Generated glowing maze"></canvas></main><script>
const $=id=>document.getElementById(id),canvas=$('maze'),ctx=canvas.getContext('2d');
let steps=[],walls=[],cols=22,rows=14,progress=0,playing=true,last=0,frame=0;
function random(seed){let a=seed|0;return ()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function build(){
cancelAnimationFrame(frame);cols=Math.max(4,Math.min(65,+$('cols').value||22));rows=Math.max(4,Math.min(45,+$('rows').value||14));
const rng=random(+$('seed').value||0),seen=new Uint8Array(cols*rows),stack=[0],dirs=[[-1,0,0,2],[0,1,1,3],[1,0,2,0],[0,-1,3,1]];
steps=[];seen[0]=1;
while(stack.length){let id=stack[stack.length-1],r=Math.floor(id/cols),c=id%cols;
let options=dirs.map(([dr,dc,a,b])=>[r+dr,c+dc,a,b]).filter(([nr,nc])=>nr>=0&&nr<rows&&nc>=0&&nc<cols&&!seen[nr*cols+nc]);
if(!options.length){stack.pop();continue}
let [nr,nc,a,b]=options[Math.floor(rng()*options.length)],next=nr*cols+nc;
steps.push([id,a,next,b]);seen[next]=1;stack.push(next)}
progress=0;playing=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;$('play').textContent=playing?'Pause':'Play';last=0;tick(0)}
function render(){
walls=Array.from({length:cols*rows},()=>[true,true,true,true]);
for(let j=0;j<Math.floor(progress);j++){const [id,a,next,b]=steps[j];walls[id][a]=false;walls[next][b]=false}
ctx.fillStyle='#060b11';ctx.fillRect(0,0,canvas.width,canvas.height);
const cell=Math.min((canvas.width-110)/cols,(canvas.height-110)/rows),ox=(canvas.width-cols*cell)/2,oy=(canvas.height-rows*cell)/2,segments=[];
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let w=walls[r*cols+c],x=ox+c*cell,y=oy+r*cell;
if(w[0])segments.push([x,y,x+cell,y]);if(w[3])segments.push([x,y,x,y+cell]);
if(r===rows-1&&w[2])segments.push([x,y+cell,x+cell,y+cell]);if(c===cols-1&&w[1])segments.push([x+cell,y,x+cell,y+cell])}
ctx.lineJoin='miter';
for(const [width,color] of [[13,'rgba(76,201,255,.035)'],[7,'rgba(101,216,255,.12)'],[3,'rgba(167,236,255,.40)'],[1.1,'rgba(229,250,255,.98)']]){
ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();for(const [x,y,x2,y2] of segments){ctx.moveTo(x,y);ctx.lineTo(x2,y2)}ctx.stroke()}
}
function tick(t){if(playing&&last){progress=Math.min(steps.length,progress+(t-last)/1000*(2+Number($('speed').value)*.85));if(progress===steps.length){playing=false;$('play').textContent='Play'}}last=t;render();frame=requestAnimationFrame(tick)}
$('generate').onclick=build;$('random').onclick=()=>{$('seed').value=Math.floor(Math.random()*1000000000);build()};
$('replay').onclick=()=>{progress=0;playing=true;$('play').textContent='Pause'};
$('play').onclick=()=>{if(progress===steps.length)progress=0;playing=!playing;$('play').textContent=playing?'Pause':'Play'};
$('save').onclick=()=>{const p=progress;progress=steps.length;render();const a=document.createElement('a');a.download='procedural-maze.png';a.href=canvas.toDataURL('image/png');a.click();progress=p;render()};
document.addEventListener('visibilitychange',()=>{last=0});build();
</script></body></html>
